name: Publish to NPM

on:
  push:
    branches:
      - main
    # Skip changes that don't alter the published package.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'mkdocs.yml'
      - 'mkdocs_hooks.py'
      - '.github/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'CITATION.cff'
  release:
    types: [created]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Bump version
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          sed -i "s/\"version\": \".*\"/\"version\": \"$NEW_VERSION\"/g" server.json
          git add package.json package-lock.json server.json
          git commit -m "Bump version to $NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"
          git push
          git push --tags

      - name: Build
        run: npm run build

      - name: Publish to NPM (trusted publishing via OIDC)
        if: success()
        run: npm publish --access public

      # The MCP Registry listing is published by mcp-registry.yml after this
      # workflow succeeds, once npm shows the new version.
